<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 小游戏</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23edc22e'/%3E%3Ctext x='50' y='68' font-size='42' font-weight='800' text-anchor='middle' fill='%23f9f6f2' font-family='Arial, sans-serif'%3E2048%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="classic">
  <div class="wrap">
    <header class="top">
      <h1 class="logo">2048</h1>
      <div class="scores">
        <div class="score-box" id="score-box">
          <span class="score-label">得分</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">最高分</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="subbar">
      <p class="tagline">合并相同数字，合成 2048！</p>
      <button id="new-game" class="btn">新游戏</button>
    </div>

    <div id="board" class="board">
      <div id="overlay" class="overlay">
        <h2 class="overlay-title" id="overlay-title"></h2>
        <p class="overlay-text" id="overlay-text"></p>
        <div class="overlay-btns">
          <button id="keep-going" class="btn">继续游戏</button>
          <button id="again" class="btn">再来一局</button>
        </div>
      </div>
    </div>

    <div id="confirm" class="confirm">
      <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h3 class="confirm-title" id="confirm-title">重新开始？</h3>
        <p class="confirm-text">当前进度和分数将清空，确定要开始新游戏吗？</p>
        <div class="confirm-btns">
          <button id="confirm-cancel" class="btn btn-plain">取消</button>
          <button id="confirm-ok" class="btn">确定</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl" data-dir="up" aria-label="上">↑</button>
      <div class="ctrl-row">
        <button class="ctrl" data-dir="left" aria-label="左">←</button>
        <button class="ctrl" data-dir="down" aria-label="下">↓</button>
        <button class="ctrl" data-dir="right" aria-label="右">→</button>
      </div>
    </div>

    <div class="themes">
      <span class="themes-label">主题</span>
      <button class="theme-btn classic" data-theme="classic">经典</button>
      <button class="theme-btn dark" data-theme="dark">暗夜</button>
      <button class="theme-btn retro" data-theme="retro">复古</button>
    </div>

    <p class="tips">操作：方向键 / WASD / 滑动屏幕 · 按 R 重新开始</p>
  </div>

  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
