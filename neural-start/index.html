<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020208">
  <title>NEURAL SWARM · Synaptic Cloud</title>
  <link rel="stylesheet" href="neural-start.css">
</head>
<body>
  <main class="neural-page loading">
    <canvas class="neural-field" aria-hidden="true"></canvas>
    <div class="screen-shade" aria-hidden="true"></div>

    <header class="hud brand" aria-label="Neural Swarm">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="6" cy="12" r="2.2"/><circle cx="17.5" cy="6" r="2.2"/><circle cx="17.5" cy="18" r="2.2"/>
          <path d="m8 11 7.5-4M8 13l7.5 4M17.5 8.3v7.4"/>
        </svg>
      </span>
      <span class="brand-copy"><strong>NEURAL</strong><small>SWARM</small></span>
    </header>

    <div class="hud status" aria-label="System status">
      <i class="status-dot"></i><span>SYSTEM OPTIMAL</span>
    </div>

    <section class="hero" aria-labelledby="hero-title">
      <div class="protocol">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-3Z"/>
          <path d="m8.5 12 2.2 2.2 4.8-5"/>
        </svg>
        SECURE NEURAL PROTOCOL V3.0
      </div>
      <h1 id="hero-title"><span>SYNAPTIC</span><em>CLOUD</em></h1>
      <p class="tagline">Empowering the collective through distributed neural intelligence and real-time threat detection.</p>
      <div class="telemetry">LATENCY: 0.04MS // NODES: 104,856</div>
      <a class="deploy" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M12 3v18M3 12h18M6.5 6.5l11 11M17.5 6.5l-11 11"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span>DEPLOY NODE</span><span class="deploy-arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <div class="hud metric metric-a"><label>BANDWIDTH</label><strong>428 TB/s</strong></div>
    <div class="hud metric metric-b"><label>ACTIVE THREADS</label><strong>8,920,001</strong></div>

    <nav class="hud pager" aria-label="Node layers">
      <button class="active" type="button" aria-label="Layer 1">1</button>
      <button type="button" aria-label="Layer 2">2</button>
      <button type="button" aria-label="Layer 3">3</button>
      <button type="button" aria-label="Layer 4">4</button>
      <button type="button" aria-label="Layer 5">5</button>
      <button type="button" aria-label="Layer 6">6</button>
      <button type="button" aria-label="Layer 7">7</button>
      <button type="button" aria-label="Layer 8">8</button>
    </nav>

    <div class="hud secure"><i></i> ENCRYPTED CONNECTION</div>

    <div class="boot" aria-live="polite">
      <span class="boot-label">同步节点</span>
      <span class="boot-sub">SYNCING NODES</span>
      <span class="boot-line"></span>
    </div>

    <div class="transition" aria-hidden="true">
      <div class="rings"></div>
      <span class="synth">SYNTHESIZING NODES</span>
    </div>
  </main>
  <script type="module" src="neural-start.js"></script>
</body>
</html>
